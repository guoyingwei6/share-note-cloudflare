name = "share-note-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Static assets (MathJax, Lucide, fonts, default styles, favicons)
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 Database binding
# Run: npx wrangler d1 create notesx-db
# Then replace database_id below with your real ID:
[[d1_databases]]
binding = "DB"
database_name = "notesx-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# Cloudflare R2 Storage binding
# Run: npx wrangler r2 bucket create notesx-storage
[[r2_buckets]]
binding = "R2"
bucket_name = "notesx-storage"

# Environment variables
[vars]
BASE_WEB_URL = "https://notes.yourdomain.com"
HASH_SALT = "replace-this-with-a-random-salt-string"
ALLOW_NEW_USERS = "true"
FILENAME_LENGTH_HTML = "8"
MAXIMUM_UPLOAD_SIZE_MB = "5"
